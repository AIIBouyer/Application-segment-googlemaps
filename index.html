<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a472a">
    <title>Navigation Test Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a472a;
            --primary-light: #2d6e45;
            --accent: #f4a500;
            --danger: #d32f2f;
            --success: #4caf50;
            --bg: #0a0e0d;
            --bg-card: #1a1f1e;
            --text: #e8f5e9;
            --text-dim: #81c784;
            --border: #2d6e45;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 20px;
            margin: -20px -20px 20px -20px;
            border-bottom: 3px solid var(--accent);
        }
        h1 { font-size: 1.8em; font-weight: 800; margin-bottom: 5px; }
        .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--text-dim); }
        .card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            background: rgba(42, 78, 55, 0.3);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 8px;
            color: var(--text);
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }
        button.success { background: linear-gradient(135deg, var(--success) 0%, #388e3c 100%); border-color: #81c784; }
        button.danger { background: linear-gradient(135deg, var(--danger) 0%, #b71c1c 100%); border-color: #ff6659; }
        button.warning { background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); border-color: #ffb74d; }
        .segment-display {
            background: var(--bg-card);
            border: 3px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .segment-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3em;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .segment-range {
            font-size: 1.2em;
            color: var(--text-dim);
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
        }
        .location-info {
            background: rgba(42, 78, 55, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: rgba(42, 78, 55, 0.3);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8em;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-label { font-size: 0.75em; color: var(--text-dim); text-transform: uppercase; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(42, 78, 55, 0.3);
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
            transition: width 0.5s ease;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            background: rgba(244, 165, 0, 0.1);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .hidden { display: none !important; }
        .test-mode-banner {
            background: #ff9800;
            color: #000;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            margin: -20px -20px 20px -20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-mode-banner">
            🧪 MODE TEST - Simulation GPS Active
        </div>

        <header>
            <h1>🗺️ Navigation Test</h1>
            <div class="subtitle">Test Sans Déplacement</div>
        </header>

        <!-- ÉCRAN CHARGEMENT -->
        <div id="setupScreen">
            <div class="card">
                <h2 style="margin-bottom: 15px;">📋 Charger Mission</h2>
                <textarea id="segmentsInput" placeholder='{"segments": [...], "stats": {...}}'></textarea>
                <button id="loadMissionBtn" class="success">▶ Charger Mission</button>
            </div>
        </div>

        <!-- ÉCRAN NAVIGATION -->
        <div id="navScreen" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%;"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="currentSegmentNum">1</div>
                    <div class="stat-label">Segment actuel</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalSegments">0</div>
                    <div class="stat-label">Total segments</div>
                </div>
            </div>

            <div id="alertZone"></div>

            <div class="segment-display">
                <div class="segment-number" id="segmentNumber">SEGMENT 1</div>
                <div class="segment-range" id="segmentRange">Points 1-11</div>

                <div class="location-info">
                    <div style="font-size: 0.85em; color: var(--text-dim); margin-bottom: 5px;">📍 DÉPART</div>
                    <div id="originAddress">Chargement...</div>
                </div>

                <div class="location-info">
                    <div style="font-size: 0.85em; color: var(--text-dim); margin-bottom: 5px;">🎯 ARRIVÉE</div>
                    <div id="destAddress">Chargement...</div>
                </div>

                <div class="stats-grid" style="margin-top: 15px;">
                    <div class="stat-box">
                        <div class="stat-value" id="pointsCount">0</div>
                        <div class="stat-label">Points</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="waypointsCount">0</div>
                        <div class="stat-label">Waypoints</div>
                    </div>
                </div>
            </div>

            <button id="openMapsBtn" class="success" style="margin-bottom: 15px;">
                🗺️ Ouvrir dans Google Maps
            </button>

            <!-- BOUTONS TEST -->
            <div style="background: rgba(255, 152, 0, 0.1); border: 2px solid #ff9800; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
                <div style="text-align: center; font-weight: 600; margin-bottom: 10px; color: #ff9800;">
                    🧪 CONTRÔLES TEST
                </div>
                <button id="simulateEndBtn" class="warning">
                    ⚡ Simuler Fin de Segment
                </button>
                <button id="autoNextBtn" class="warning">
                    🤖 Auto-Suivant (3s)
                </button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <button id="prevSegmentBtn" style="background: rgba(42, 78, 55, 0.5);">
                    ← Précédent
                </button>
                <button id="nextSegmentBtn" style="background: rgba(42, 78, 55, 0.5);">
                    Suivant →
                </button>
            </div>

            <button id="endMissionBtn" class="danger">
                ⏹ Terminer Mission
            </button>
        </div>
    </div>

    <script>
        let segments = [];
        let currentSegmentIndex = 0;
        let autoMode = false;

        // CHARGEMENT MISSION
        document.getElementById('loadMissionBtn').addEventListener('click', () => {
            const input = document.getElementById('segmentsInput').value.trim();
            
            if (!input) {
                alert('⚠️ Veuillez coller les données JSON');
                return;
            }

            try {
                const data = JSON.parse(input);
                
                let segs = null;
                if (data.segments && Array.isArray(data.segments)) {
                    segs = data.segments;
                } else if (Array.isArray(data)) {
                    segs = data;
                } else {
                    throw new Error('Format JSON invalide');
                }

                if (!segs || segs.length === 0) {
                    throw new Error('Aucun segment trouvé');
                }

                segments = segs;
                currentSegmentIndex = 0;

                document.getElementById('totalSegments').textContent = segments.length;
                
                document.getElementById('setupScreen').classList.add('hidden');
                document.getElementById('navScreen').classList.remove('hidden');

                displaySegment(currentSegmentIndex);

            } catch (error) {
                alert('❌ Erreur : ' + error.message);
            }
        });

        // AFFICHAGE SEGMENT
        function displaySegment(index) {
            if (index < 0 || index >= segments.length) return;

            const segment = segments[index];
            currentSegmentIndex = index;

            document.getElementById('segmentNumber').textContent = `SEGMENT ${segment.segment_id || (index + 1)}`;
            document.getElementById('segmentRange').textContent = `Points ${segment.point_range_start || '?'}-${segment.point_range_end || '?'}`;
            document.getElementById('originAddress').textContent = segment.origin?.adresse || 'Non renseigné';
            document.getElementById('destAddress').textContent = segment.destination?.adresse || 'Non renseigné';
            document.getElementById('pointsCount').textContent = segment.points_count || '?';
            document.getElementById('waypointsCount').textContent = segment.waypoints_count || '?';
            document.getElementById('currentSegmentNum').textContent = index + 1;

            const progress = ((index + 1) / segments.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            document.getElementById('prevSegmentBtn').disabled = index === 0;
            document.getElementById('nextSegmentBtn').disabled = index === segments.length - 1;

            // Effacer alertes
            document.getElementById('alertZone').innerHTML = '';
        }

        // OUVRIR GOOGLE MAPS
        document.getElementById('openMapsBtn').addEventListener('click', () => {
            const segment = segments[currentSegmentIndex];
            const url = segment.google_maps_url_short || segment.google_maps_url;
            
            if (url) {
                window.open(url, '_blank');
            } else {
                alert('❌ URL Google Maps non disponible');
            }
        });

        // NAVIGATION MANUELLE
        document.getElementById('prevSegmentBtn').addEventListener('click', () => {
            if (currentSegmentIndex > 0) {
                displaySegment(currentSegmentIndex - 1);
            }
        });

        document.getElementById('nextSegmentBtn').addEventListener('click', () => {
            if (currentSegmentIndex < segments.length - 1) {
                displaySegment(currentSegmentIndex + 1);
            }
        });

        // 🧪 SIMULATION FIN DE SEGMENT
        document.getElementById('simulateEndBtn').addEventListener('click', () => {
            if (currentSegmentIndex >= segments.length - 1) {
                alert('✅ Vous êtes déjà au dernier segment !');
                return;
            }

            showNextSegmentAlert();
        });

        // 🧪 MODE AUTO (passe au suivant toutes les 3s)
        document.getElementById('autoNextBtn').addEventListener('click', () => {
            autoMode = !autoMode;
            const btn = document.getElementById('autoNextBtn');
            
            if (autoMode) {
                btn.textContent = '⏸️ Arrêter Auto';
                btn.style.background = 'linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%)';
                startAutoMode();
            } else {
                btn.textContent = '🤖 Auto-Suivant (3s)';
                btn.style.background = 'linear-gradient(135deg, #ff9800 0%, #f57c00 100%)';
            }
        });

        function startAutoMode() {
            if (!autoMode || currentSegmentIndex >= segments.length - 1) {
                autoMode = false;
                document.getElementById('autoNextBtn').textContent = '🤖 Auto-Suivant (3s)';
                document.getElementById('autoNextBtn').style.background = 'linear-gradient(135deg, #ff9800 0%, #f57c00 100%)';
                return;
            }

            setTimeout(() => {
                if (autoMode) {
                    goToNextSegment();
                    startAutoMode();
                }
            }, 3000);
        }

        function showNextSegmentAlert() {
            const alertZone = document.getElementById('alertZone');
            alertZone.innerHTML = '';

            const alert = document.createElement('div');
            alert.className = 'alert';
            alert.innerHTML = `
                <div style="font-weight: 600; margin-bottom: 10px;">
                    ⚠️ Fin de segment proche
                </div>
                <div style="margin-bottom: 15px;">
                    Vous approchez de la fin du segment ${currentSegmentIndex + 1}.
                </div>
                <button onclick="goToNextSegment()" class="success" style="margin: 0;">
                    ▶ Passer au Segment ${currentSegmentIndex + 2}
                </button>
            `;
            alertZone.appendChild(alert);
        }

        window.goToNextSegment = function() {
            document.getElementById('alertZone').innerHTML = '';
            
            if (currentSegmentIndex < segments.length - 1) {
                displaySegment(currentSegmentIndex + 1);
                
                // Auto-ouvrir Google Maps
                setTimeout(() => {
                    document.getElementById('openMapsBtn').click();
                }, 500);
            } else {
                alert('✅ Mission terminée ! Dernier segment atteint.');
            }
        };

        // FIN DE MISSION
        document.getElementById('endMissionBtn').addEventListener('click', () => {
            if (confirm('⚠️ Confirmer la fin de mission ?')) {
                autoMode = false;
                segments = [];
                currentSegmentIndex = 0;
                
                document.getElementById('navScreen').classList.add('hidden');
                document.getElementById('setupScreen').classList.remove('hidden');
                document.getElementById('segmentsInput').value = '';
            }
        });
    </script>
</body>
</html>
