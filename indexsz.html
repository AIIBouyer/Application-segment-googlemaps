<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a472a">
    <title>Navigation Automatique</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1a472a;
            --primary-light: #2d6e45;
            --accent: #f4a500;
            --danger: #d32f2f;
            --success: #4caf50;
            --bg: #0a0e0d;
            --bg-card: #1a1f1e;
            --text: #e8f5e9;
            --text-dim: #81c784;
            --border: #2d6e45;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 20px;
            margin: -20px -20px 20px -20px;
            border-bottom: 3px solid var(--accent);
        }
        h1 { font-size: 1.8em; font-weight: 800; margin-bottom: 5px; }
        .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--text-dim); }
        .card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: 2px solid var(--accent);
            border-radius: 8px;
            color: var(--text);
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }
        button.success { background: linear-gradient(135deg, var(--success) 0%, #388e3c 100%); border-color: #81c784; }
        button.danger { background: linear-gradient(135deg, var(--danger) 0%, #b71c1c 100%); border-color: #ff6659; }
        .segment-display {
            background: var(--bg-card);
            border: 3px solid var(--accent);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .segment-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3em;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .location-info {
            background: rgba(42, 78, 55, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: rgba(42, 78, 55, 0.3);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8em;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-label { font-size: 0.75em; color: var(--text-dim); text-transform: uppercase; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(42, 78, 55, 0.3);
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
            transition: width 0.5s ease;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .hidden { display: none !important; }
        input[type="file"] {
            width: 100%;
            padding: 15px;
            background: rgba(42, 78, 55, 0.3);
            border: 2px dashed var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ Navigation Simplifiée</h1>
            <div class="subtitle">Chargement Automatique</div>
        </header>

        <!-- ÉCRAN CHARGEMENT -->
        <div id="loadingScreen">
            <div class="card">
                <div class="loading">Chargement de la mission</div>
            </div>
        </div>

        <!-- ÉCRAN MANUEL -->
        <div id="manualScreen" class="hidden">
            <div class="card">
                <h2 style="margin-bottom: 15px;">📂 Choisir Mission</h2>
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <div style="font-size: 3em; margin-bottom: 10px;">📁</div>
                    <div style="font-weight: 600; margin-bottom: 15px;">Sélectionner le fichier JSON</div>
                </div>
                
                <input type="file" id="fileInput" accept=".json">
                
                <div style="text-align: center; color: var(--text-dim); font-size: 0.85em; margin-top: 15px;">
                    💡 Le fichier JSON a été envoyé par email
                </div>
            </div>
        </div>

        <!-- ÉCRAN NAVIGATION -->
        <div id="navScreen" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%;"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="currentSegmentNum">1</div>
                    <div class="stat-label">Segment actuel</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalSegments">0</div>
                    <div class="stat-label">Total segments</div>
                </div>
            </div>

            <div class="segment-display">
                <div class="segment-number" id="segmentNumber">SEGMENT 1</div>
                <div style="font-size: 1.2em; color: var(--text-dim); margin-bottom: 20px; font-family: 'JetBrains Mono', monospace;" id="segmentRange">Points 1-11</div>

                <div class="location-info">
                    <div style="font-size: 0.85em; color: var(--text-dim); margin-bottom: 5px;">📍 DÉPART</div>
                    <div id="originAddress">Chargement...</div>
                </div>

                <div class="location-info">
                    <div style="font-size: 0.85em; color: var(--text-dim); margin-bottom: 5px;">🎯 ARRIVÉE</div>
                    <div id="destAddress">Chargement...</div>
                </div>
            </div>

            <button id="openMapsBtn" class="success" style="margin-bottom: 15px;">
                🗺️ Ouvrir dans Google Maps
            </button>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <button id="prevSegmentBtn" style="background: rgba(42, 78, 55, 0.5);">← Préc.</button>
                <button id="nextSegmentBtn" style="background: rgba(42, 78, 55, 0.5);">Suiv. →</button>
            </div>

            <button id="endMissionBtn" class="danger">⏹ Terminer</button>
        </div>
    </div>

    <script>
        let segments = [];
        let currentSegmentIndex = 0;

        // DÉTECTION CHARGEMENT AUTO (via URL ou localStorage)
        window.addEventListener('load', async () => {
            // Option 1 : Charger depuis URL
            const urlParams = new URLSearchParams(window.location.search);
            const jsonUrl = urlParams.get('json');
            
            if (jsonUrl) {
                await loadFromUrl(jsonUrl);
                return;
            }

            // Option 2 : Reprendre mission en cours
            const savedData = localStorage.getItem('mission_data');
            if (savedData) {
                if (confirm('📋 Mission en cours. Reprendre ?')) {
                    try {
                        const data = JSON.parse(savedData);
                        loadMissionData(data);
                        return;
                    } catch (e) {
                        localStorage.removeItem('mission_data');
                    }
                }
            }

            // Option 3 : Chargement manuel
            showManualScreen();
        });

        // CHARGEMENT DEPUIS URL
        async function loadFromUrl(url) {
            console.log('🔄 Tentative téléchargement depuis:', url);
            
            try {
                console.log('📡 Envoi requête fetch...');
                const response = await fetch(url);
                
                console.log('📊 Response status:', response.status);
                console.log('📊 Response ok:', response.ok);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}: ${response.statusText}`);
                }
                
                console.log('📄 Parsing JSON...');
                const data = await response.json();
                
                console.log('✅ JSON parsé avec succès');
                console.log('📦 Segments trouvés:', data.segments?.length || 0);
                
                loadMissionData(data);
            } catch (error) {
                console.error('❌ Erreur complète:', error);
                
                // Afficher erreur détaillée à l'utilisateur
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="card">
                        <h2 style="color: #d32f2f; margin-bottom: 15px;">❌ Erreur de Chargement</h2>
                        
                        <div style="background: #ffebee; border-left: 4px solid #d32f2f; padding: 15px; margin-bottom: 20px; border-radius: 5px;">
                            <strong>Message :</strong><br>
                            ${error.message}
                        </div>
                        
                        <div style="background: #f5f5f5; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-family: monospace; font-size: 0.85em; word-break: break-all;">
                            <strong>URL tentée :</strong><br>
                            ${url}
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <strong>Solutions possibles :</strong>
                            <ol style="margin-top: 10px; padding-left: 20px; line-height: 1.8;">
                                <li>Vérifier que le fichier Google Drive est public</li>
                                <li>Vérifier que le proxy CORS fonctionne</li>
                                <li>Essayer de charger manuellement via fichier</li>
                            </ol>
                        </div>
                        
                        <button onclick="showManualScreen()" class="success">
                            📂 Charger Fichier Manuellement
                        </button>
                    </div>
                `;
                
                showManualScreen();
            }
        }

        // CHARGEMENT FICHIER MANUEL
        document.getElementById('fileInput').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    loadMissionData(data);
                } catch (error) {
                    alert('❌ Fichier JSON invalide : ' + error.message);
                }
            };
            reader.readAsText(file);
        });

        // CHARGER DONNÉES MISSION
        function loadMissionData(data) {
            let segs = null;
            
            if (data.segments && Array.isArray(data.segments)) {
                segs = data.segments;
            } else if (Array.isArray(data)) {
                segs = data;
            } else {
                alert('❌ Format JSON invalide');
                showManualScreen();
                return;
            }

            if (!segs || segs.length === 0) {
                alert('❌ Aucun segment trouvé');
                showManualScreen();
                return;
            }

            segments = segs;
            currentSegmentIndex = 0;

            localStorage.setItem('mission_data', JSON.stringify({segments: segments}));
            
            showNavigationScreen();
        }

        // AFFICHAGE ÉCRANS
        function showManualScreen() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('manualScreen').classList.remove('hidden');
        }

        function showNavigationScreen() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('manualScreen').classList.add('hidden');
            document.getElementById('navScreen').classList.remove('hidden');
            
            document.getElementById('totalSegments').textContent = segments.length;
            displaySegment(currentSegmentIndex);
        }

        // AFFICHAGE SEGMENT
        function displaySegment(index) {
            if (index < 0 || index >= segments.length) return;

            const segment = segments[index];
            currentSegmentIndex = index;

            document.getElementById('segmentNumber').textContent = `SEGMENT ${segment.segment_id || (index + 1)}`;
            document.getElementById('segmentRange').textContent = `Points ${segment.point_range_start || '?'}-${segment.point_range_end || '?'}`;
            document.getElementById('originAddress').textContent = segment.origin?.adresse || 'Non renseigné';
            document.getElementById('destAddress').textContent = segment.destination?.adresse || 'Non renseigné';
            document.getElementById('currentSegmentNum').textContent = index + 1;

            const progress = ((index + 1) / segments.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            document.getElementById('prevSegmentBtn').disabled = index === 0;
            document.getElementById('nextSegmentBtn').disabled = index === segments.length - 1;

            localStorage.setItem('current_segment', index.toString());
        }

        // OUVRIR GOOGLE MAPS
        document.getElementById('openMapsBtn').addEventListener('click', () => {
            const segment = segments[currentSegmentIndex];
            const url = segment.google_maps_url_short || segment.google_maps_url;
            
            if (url) {
                window.open(url, '_blank');
            } else {
                alert('❌ URL non disponible');
            }
        });

        // NAVIGATION
        document.getElementById('prevSegmentBtn').addEventListener('click', () => {
            if (currentSegmentIndex > 0) {
                displaySegment(currentSegmentIndex - 1);
            }
        });

        document.getElementById('nextSegmentBtn').addEventListener('click', () => {
            if (currentSegmentIndex < segments.length - 1) {
                displaySegment(currentSegmentIndex + 1);
            }
        });

        // FIN MISSION
        document.getElementById('endMissionBtn').addEventListener('click', () => {
            if (confirm('⚠️ Terminer la mission ?')) {
                localStorage.clear();
                location.reload();
            }
        });
    </script>
</body>
</html>
