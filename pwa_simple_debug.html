<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Simple</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0e0d;
            color: #e8f5e9;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 {
            background: linear-gradient(135deg, #1a472a 0%, #2d6e45 100%);
            padding: 20px;
            margin: -20px -20px 20px -20px;
            border-bottom: 3px solid #f4a500;
            font-size: 1.5em;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            background: #1a1f1e;
            border: 2px solid #2d6e45;
            color: #e8f5e9;
            font-family: monospace;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #1a472a 0%, #2d6e45 100%);
            border: 2px solid #f4a500;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:active { background: #2d6e45; }
        .segment {
            background: #1a1f1e;
            border: 2px solid #f4a500;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        .segment.active { display: block; }
        .big-number {
            font-size: 3em;
            color: #f4a500;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .info {
            background: rgba(42, 78, 55, 0.3);
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #f4a500;
        }
        .debug {
            background: #1a1f1e;
            border: 1px solid #2d6e45;
            padding: 15px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 200px;
            overflow-y: auto;
        }
        .success { color: #4caf50; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Navigation Trajet</h1>

        <!-- ÉCRAN CHARGEMENT -->
        <div id="loadScreen">
            <h2 style="margin-bottom: 15px;">📋 Charger Mission</h2>
            <textarea id="jsonInput" placeholder="Coller le JSON ici..."></textarea>
            <button onclick="loadMission()">▶ CHARGER</button>
            
            <div class="debug" id="debugZone">
                <div class="success">✓ Prêt à charger</div>
                <div style="margin-top: 10px; color: #81c784;">
                    Instructions :<br>
                    1. Coller le JSON dans le champ<br>
                    2. Cliquer CHARGER<br>
                    3. Voir les messages ci-dessous
                </div>
            </div>
        </div>

        <!-- ÉCRAN NAVIGATION -->
        <div id="navScreen" style="display: none;">
            <div class="info" style="text-align: center; margin-bottom: 20px;">
                <div>Segment <span id="current">1</span> / <span id="total">0</span></div>
            </div>

            <div id="segmentDisplay"></div>

            <button onclick="prevSegment()">← PRÉCÉDENT</button>
            <button onclick="nextSegment()">SUIVANT →</button>
            <button onclick="endMission()" style="background: #d32f2f; border-color: #ff6659;">⏹ TERMINER</button>
        </div>
    </div>

    <script>
        let segments = [];
        let currentIndex = 0;

        function log(message, type = 'info') {
            const debug = document.getElementById('debugZone');
            const color = type === 'success' ? '#4caf50' : type === 'error' ? '#d32f2f' : '#81c784';
            debug.innerHTML += `<div style="color: ${color}; margin-top: 5px;">${message}</div>`;
            debug.scrollTop = debug.scrollHeight;
            console.log(message);
        }

        function loadMission() {
            const input = document.getElementById('jsonInput').value.trim();
            const debug = document.getElementById('debugZone');
            debug.innerHTML = '';

            log('📊 Longueur input: ' + input.length);

            if (!input) {
                log('❌ ERREUR: Champ vide', 'error');
                alert('⚠️ Veuillez coller le JSON');
                return;
            }

            log('🔄 Parsing JSON...');

            try {
                const data = JSON.parse(input);
                log('✅ JSON valide !', 'success');

                // Détection format
                let segs = null;
                
                if (data.segments && Array.isArray(data.segments)) {
                    segs = data.segments;
                    log('✅ Format PWA détecté', 'success');
                } else if (Array.isArray(data)) {
                    segs = data;
                    log('✅ Format tableau détecté', 'success');
                } else {
                    log('❌ Structure inconnue', 'error');
                    log('Propriétés trouvées: ' + Object.keys(data).join(', '), 'error');
                    alert('❌ Format JSON non reconnu\n\nPropriétés: ' + Object.keys(data).join(', '));
                    return;
                }

                if (!segs || segs.length === 0) {
                    log('❌ Aucun segment trouvé', 'error');
                    alert('❌ Aucun segment dans les données');
                    return;
                }

                segments = segs;
                currentIndex = 0;

                log(`✅ ${segments.length} segments chargés`, 'success');
                log('Premier segment: ' + JSON.stringify(segments[0]).substring(0, 100) + '...');

                document.getElementById('total').textContent = segments.length;
                
                setTimeout(() => {
                    document.getElementById('loadScreen').style.display = 'none';
                    document.getElementById('navScreen').style.display = 'block';
                    displaySegment();
                }, 1000);

            } catch (error) {
                log('❌ ERREUR PARSING: ' + error.message, 'error');
                log('Début input: ' + input.substring(0, 100), 'error');
                alert('❌ JSON invalide\n\n' + error.message + '\n\nVoir zone debug');
            }
        }

        function displaySegment() {
            if (currentIndex < 0 || currentIndex >= segments.length) return;

            const seg = segments[currentIndex];
            document.getElementById('current').textContent = currentIndex + 1;

            const html = `
                <div class="big-number">SEGMENT ${seg.segment_id || (currentIndex + 1)}</div>
                <div style="font-size: 1.2em; margin-bottom: 20px;">
                    Points ${seg.point_range_start || '?'}-${seg.point_range_end || '?'}
                </div>
                
                <div class="info">
                    <strong>📍 Départ</strong><br>
                    ${seg.origin?.adresse || 'Non renseigné'}
                </div>
                
                <div class="info">
                    <strong>🎯 Arrivée</strong><br>
                    ${seg.destination?.adresse || 'Non renseigné'}
                </div>
                
                <button onclick="openMaps()" style="background: #4caf50; border-color: #81c784; margin-top: 15px;">
                    🗺️ OUVRIR GOOGLE MAPS
                </button>
            `;

            document.getElementById('segmentDisplay').innerHTML = html;
        }

        function openMaps() {
            const seg = segments[currentIndex];
            const url = seg.google_maps_url_short || seg.google_maps_url;
            
            if (url) {
                window.open(url, '_blank');
            } else {
                alert('❌ URL Google Maps manquante');
            }
        }

        function prevSegment() {
            if (currentIndex > 0) {
                currentIndex--;
                displaySegment();
            }
        }

        function nextSegment() {
            if (currentIndex < segments.length - 1) {
                currentIndex++;
                displaySegment();
            } else {
                alert('✅ Dernier segment atteint !');
            }
        }

        function endMission() {
            if (confirm('⚠️ Terminer la mission ?')) {
                segments = [];
                currentIndex = 0;
                document.getElementById('loadScreen').style.display = 'block';
                document.getElementById('navScreen').style.display = 'none';
                document.getElementById('jsonInput').value = '';
                document.getElementById('debugZone').innerHTML = '<div class="success">✓ Mission terminée - Prêt pour nouvelle mission</div>';
            }
        }

        // Test automatique au chargement (pour debug)
        window.addEventListener('load', () => {
            log('✓ Application chargée');
            log('✓ Prêt à recevoir JSON');
        });
    </script>
</body>
</html>
